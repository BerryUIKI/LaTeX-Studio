[package]
name = "latex-studio-core"
version = "0.8.5"
description = "High-performance Rust Core for LaTeX Studio"
authors = ["BerryUIKI"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.5"
thiserror = "1.0"

[lib]
name = "latex_studio_core"
path = "src/lib.rs"
